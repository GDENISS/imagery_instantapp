# Sentinel-2 Explorer on the VPS.
#
# Run from the REPOSITORY ROOT so the build context includes the source and the env file:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Port choice matters on this host. Already taken by existing containers:
#   80    rapida_backend_nginx_1
#   3000  revenue-system-web-1
#   8000  rapida_backend_web_1
#   8080  nginx4rapida_geonode
#   8081  revenue-system-api-1
#   8443  nginx4rapida_geonode
#   29092 kafka
#
# 8090 is used below because it is clear of all of those. Confirm before starting:
#   sudo ss -tlnp | grep -E ':(80|443|8090)\b'

services:
    sentinel2explorer:
        build:
            # the repository root, so package.json and .env.production are in the context
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                APP: sentinel2explorer
                ENV_FILE: .env.production
        image: sentinel2explorer:latest
        container_name: sentinel2explorer
        restart: unless-stopped
        ports:
            # Bound to localhost only, purely so you can curl it on the server to check the container
            # in isolation. Caddy reaches it over the shared Docker network, not through this port.
            # Remove this block entirely if you do not want it listening at all.
            - '127.0.0.1:8090:80'
        networks:
            - web

    # TLS terminator and public entry point.
    #
    # Remove this service if you would rather front the app with the Nginx container that already
    # owns port 80 (Option A in deploy/README.md).
    caddy:
        image: caddy:alpine
        container_name: sentinel2explorer-caddy
        restart: unless-stopped
        ports:
            # Only 443. Port 80 belongs to rapida_backend_nginx_1 on this host.
            - '443:443'
            # TLS-ALPN-01 works over TCP, but Caddy also serves HTTP/3 over UDP 443 when available.
            - '443:443/udp'
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            # Certificates live here. This MUST persist: without it Caddy re-requests a certificate
            # on every restart and will eventually hit Let's Encrypt rate limits.
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - web
        depends_on:
            - sentinel2explorer

networks:
    web:
        # Set `external: true` and change the name to the network your edge proxy already uses if you
        # intend to proxy to this container from an existing stack rather than from the Caddy service
        # above. Find it with: docker network ls
        driver: bridge

volumes:
    caddy_data:
    caddy_config:
