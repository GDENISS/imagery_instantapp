# Nginx config INSIDE the app container.
#
# This serves the static bundle over plain HTTP on port 80 of the container. TLS, the certificate and
# the public hostname are the job of whatever reverse proxy sits in front - see deploy/README.md.

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version in the Server header. It tells scanners which CVEs to
    # try and gains nothing.
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Security headers
    #
    # Repeated inside every location that sets its own add_header, because nginx drops inherited
    # add_header directives as soon as a nested block declares one of its own.
    #
    # The only Content-Security-Policy directive set is `frame-ancestors`, which controls who may
    # embed the app. Nothing else is restricted on purpose: the ArcGIS Maps SDK loads web workers from
    # blob: URLs, evaluates code at runtime and talks to a wide range of Esri hosts, so a broader
    # policy silently breaks the map. A `sandbox` directive in particular would break the CSV export,
    # because sandboxed documents cannot start downloads without `allow-downloads`.
    # ---------------------------------------------------------------------------
    include /etc/nginx/snippets/security-headers.conf;

    # ---------------------------------------------------------------------------
    # Compression
    #
    # The main bundle is over 5 MB uncompressed, so this is the single biggest factor in how fast the
    # app loads. Fonts and images are already compressed and are deliberately left out.
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---------------------------------------------------------------------------
    # Caching
    # ---------------------------------------------------------------------------

    # index.html must never be cached. If it is, a browser keeps requesting the previous build's
    # hashed asset names after a deployment and the app breaks until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The i18n files are fetched at runtime rather than bundled. The loader already appends a
    # ?modified= cache buster, so a short cache is enough.
    location /public/locales/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything webpack emits carries a content hash in its filename, so it can be cached forever.
    # A new build produces new filenames, which is exactly what makes this safe.
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # All app state lives in the URL hash (#mode=...&mainScene=...), which the browser never sends to
    # the server, so there is no client side route for nginx to rewrite.
    #
    # Deliberately =404 rather than falling back to /index.html. With a fallback, every path a
    # vulnerability scanner probes for (/phpinfo.php, /.env, /wp-login.php) answers 200 with the app
    # shell, which is both wrong and an invitation to keep probing. Unknown paths should be 404.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
