# Security headers, kept in a snippet because of how nginx handles `add_header` inheritance.
#
# nginx inherits `add_header` from an outer block ONLY if the inner block defines no `add_header` of
# its own. Every location in app.conf sets its own Cache-Control, which silently drops all of the
# server level headers. Including this snippet in each of those locations is what keeps them applied.

add_header X-Content-Type-Options "nosniff" always;

# Who is allowed to embed this app in a frame.
#
# `frame-ancestors` rather than `X-Frame-Options: SAMEORIGIN`, because the app is embedded in an
# ArcGIS Experience Builder app, which is a different origin. X-Frame-Options cannot express "allow
# this specific origin" - its ALLOW-FROM value is unsupported in every current browser - so SAMEORIGIN
# would break the embed outright.
#
# This CSP intentionally contains ONLY frame-ancestors. It restricts nothing else, which matters
# because the ArcGIS Maps SDK needs blob: workers, runtime evaluation and a wide set of Esri hosts,
# and a broader policy silently breaks the map.
#
# Remove `https://experience.arcgis.com` if the app should never be embedded, or add further origins
# as needed. Note that no header here can re-enable downloads inside the embed: the sandbox comes from
# the embedding page's own iframe attribute, not from this response.
add_header Content-Security-Policy "frame-ancestors 'self' https://experience.arcgis.com https://*.arcgis.com" always;

# IMPORTANT: do not tighten this to "no-referrer".
#
# ArcGIS application ids and proxy items can be restricted by HTTP referrer. Suppressing the Referer
# header entirely can make ArcGIS reject the app's requests, which surfaces as a confusing 403
# "You do not have permissions to access this resource". This value still sends the origin on
# cross-origin requests, which is what ArcGIS checks against.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
